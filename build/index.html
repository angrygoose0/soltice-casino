<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>soltice-casino</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
      * { margin: 0; padding: 0; }
      body { overflow: hidden; background: #0a0a0f; }
      #unity-canvas { width: 100vw; height: 100vh; display: block; background: #0a0a0f; }
      #loader {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0a0a0f;
        transition: opacity 0.4s ease;
      }
      #loader.hidden { opacity: 0; pointer-events: none; }
      #loader-title { color: #fff; font: 600 22px/1 -apple-system, sans-serif; letter-spacing: 2px; margin-bottom: 32px; }
      #loader-track { width: 200px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
      #loader-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #f7931a, #ffcc00); border-radius: 2px; transition: width 0.3s ease; }
      #loader-pct { color: #555; font: 13px/1 -apple-system, sans-serif; margin-top: 14px; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader">
      <div id="loader-title">SOLSTICE</div>
      <div id="loader-track"><div id="loader-fill"></div></div>
      <div id="loader-pct">0%</div>
    </div>
    <script src="Build/build.loader.js"></script>
    <script>
      var loader = document.getElementById("loader");
      var fill = document.getElementById("loader-fill");
      var pct = document.getElementById("loader-pct");

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/build.data.br",
        frameworkUrl: "Build/build.framework.js.br",
        codeUrl: "Build/build.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "solstice-casino",
        productVersion: "0.1.0",
      }, function (progress) {
        var p = Math.round(progress * 100);
        fill.style.width = p + "%";
        pct.textContent = p + "%";
      }).then(function () {
        loader.classList.add("hidden");
        setTimeout(function () { loader.remove(); }, 500);
      }).catch(function (message) {
        pct.textContent = "Failed to load";
        pct.style.color = "#ff4444";
      });
    </script>
  </body>
</html>
